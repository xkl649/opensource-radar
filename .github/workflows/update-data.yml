name: Update dataset

on:
  schedule:
    # 01:20 UTC daily, i.e. 09:20 Beijing time.
    - cron: "20 1 * * *"
    # Backup window: GitHub sometimes drops a scheduled run (see 2026-08-19).
    - cron: "20 13 * * *"
  workflow_dispatch:
    inputs:
      limit:
        description: "Max number of projects to keep"
        required: false
        default: "600"
      min_stars:
        description: "Minimum stars for the main sweep"
        required: false
        default: "150"

permissions:
  contents: write

concurrency:
  group: update-dataset
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Collect projects from GitHub
        env:
          # The default job token is enough for the search and repos endpoints
          # and lifts the rate limit from 60/h to 5000/h.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node scripts/fetch-github.mjs \
            --limit=${{ inputs.limit || '600' }} \
            --min-stars=${{ inputs.min_stars || '150' }}

      - name: Commit refreshed dataset
        run: |
          # git diff cannot see the README files added for newly indexed
          # projects, so the change check goes through status instead.
          if [ -z "$(git status --porcelain -- data/)" ]; then
            echo "No dataset changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # -A picks up data/readmes/ additions and the pruned files alike.
          git add -A data/
          git commit -m "chore(data): refresh open-source project index"
          git push

      # A push made with GITHUB_TOKEN does not trigger other workflows, so the
      # separate deploy.yml never ran after a scheduled refresh and the live
      # site stayed on stale data. Publish from this job instead.
      - name: Install and build
        run: |
          npm ci
          npm run build

      - name: Publish out/ to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: >
          npx wrangler@4 pages deploy out
          --project-name=opensource-radar
          --branch=main
          --commit-dirty=true
